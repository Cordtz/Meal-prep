<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>High-Protein Meal Prep</title>
<meta name="description" content="High-protein meal prep recipes, smoothies, snacks, meal planner and prep-day timeline.">
<meta name="theme-color" content="#1f7a4d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Meal Prep">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&display=swap" rel="stylesheet">
<style>
/* Layout: one-column phone app — sticky search header, card list, full-screen recipe sheet, fixed bottom tab bar */
:root{
  --bg:#f3f5f0; --surface:#ffffff; --ink:#17211b; --muted:#5b6960; --line:#dde3d9;
  --accent:#1f7a4d; --accent-ink:#ffffff; --accent-soft:#e2f0e7;
  --chicken:#d99a2b; --beef:#a8352b; --pork:#b8517a; --veg:#3f8f5a; --smoothie:#7a5cc4;
  --p:#1f7a4d; --c:#d99a2b; --f:#8a6fb8;
  --display:"Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --body:"DM Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --r:14px; color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f1411; --surface:#18201b; --ink:#e7eee8; --muted:#97a69c; --line:#29342d;
    --accent:#4cc286; --accent-ink:#0b1a11; --accent-soft:#1c3326;
    --chicken:#f0b54d; --beef:#e2685b; --pork:#e58aae; --veg:#6fcf8f; --smoothie:#b49cf0; --p:#4cc286; --c:#f0b54d; --f:#ad94e0; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1411; --surface:#18201b; --ink:#e7eee8; --muted:#97a69c; --line:#29342d;
  --accent:#4cc286; --accent-ink:#0b1a11; --accent-soft:#1c3326;
  --chicken:#f0b54d; --beef:#e2685b; --pork:#e58aae; --veg:#6fcf8f; --smoothie:#b49cf0; --p:#4cc286; --c:#f0b54d; --f:#ad94e0; color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none !important}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;letter-spacing:-.01em}
.num{font-variant-numeric:tabular-nums}

.app{max-width:720px;margin:0 auto;padding:0 16px calc(96px + env(safe-area-inset-bottom))}
header.top{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(14px + env(safe-area-inset-top)) 0 10px;display:grid;gap:10px}
.title-row{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.title-row h1{font-size:1.65rem;font-weight:800}
.title-row .sub{color:var(--muted);font-size:.85rem}
.search{display:flex;gap:8px}
.search input{flex:1;min-width:0;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:11px 14px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 14px;font-weight:500;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
.btn.ghost{background:transparent}
.badge{background:var(--accent);color:var(--accent-ink);border-radius:999px;font-size:.72rem;padding:1px 7px;font-weight:700}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 13px;font-size:.88rem;font-weight:500}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.filters{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:grid;gap:14px}
.filters[hidden]{display:none}
.fgroup{display:grid;gap:7px}
.fgroup > span{font-size:.75rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700}
.frow{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
select{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 10px}
.count{color:var(--muted);font-size:.85rem;margin:4px 0 10px}

.list{display:grid;gap:10px}
.card{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 52px 14px 18px;display:grid;gap:8px;text-align:left;width:100%;overflow:hidden}
.card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--stripe)}
.card[data-m="chicken"]{--stripe:var(--chicken)}
.card[data-m="beef"]{--stripe:var(--beef)}
.card[data-m="pork"]{--stripe:var(--pork)}
.card[data-m="veg"]{--stripe:var(--veg)}
.card[data-m="smoothie"]{--stripe:var(--smoothie)}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips.scroll::-webkit-scrollbar{display:none}
.chips.scroll .chip{flex:none}
.tag{border:1px solid var(--line);border-radius:6px;padding:0 6px;font-size:.74rem;font-weight:700;color:var(--ink)}
.card h3{font-size:1.08rem;font-weight:600;line-height:1.25}
.meta{display:flex;gap:6px 12px;flex-wrap:wrap;color:var(--muted);font-size:.83rem;align-items:center}
.meta b{color:var(--ink);font-weight:700}
.pill{font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em;padding:2px 8px;border-radius:999px;color:#fff;background:var(--stripe)}
:root[data-theme="dark"] .pill{color:#111}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .pill{color:#111}}
.bar{display:flex;height:6px;border-radius:999px;overflow:hidden;background:var(--line)}
.bar i{display:block}
.bar .bp{background:var(--p)} .bar .bc{background:var(--c)} .bar .bf{background:var(--f)}
.fav{position:absolute;right:8px;top:8px;width:40px;height:40px;border:0;background:transparent;border-radius:50%;display:grid;place-items:center;color:var(--muted)}
.fav[aria-pressed="true"]{color:var(--beef)}
.fav svg{width:22px;height:22px}
.empty{text-align:center;color:var(--muted);padding:40px 16px;background:var(--surface);border:1px dashed var(--line);border-radius:var(--r)}
.empty h3{color:var(--ink);margin-bottom:6px}

/* tab bar */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom));display:flex;justify-content:center}
nav.tabs .inner{display:grid;grid-template-columns:repeat(5,1fr);width:100%;max-width:600px}
nav.tabs a{display:grid;justify-items:center;gap:2px;padding:6px 4px;color:var(--muted);text-decoration:none;font-size:.74rem;font-weight:700;position:relative}
nav.tabs a svg{width:24px;height:24px}
nav.tabs a[aria-current="page"]{color:var(--accent)}
nav.tabs .dot{position:absolute;top:2px;left:calc(50% + 8px);background:var(--beef);color:#fff;border-radius:999px;font-size:.65rem;min-width:17px;height:17px;padding:0 4px;display:grid;place-items:center}
nav.tabs .dot[hidden]{display:none}

/* recipe sheet */
.sheet{position:fixed;inset:0;z-index:30;background:var(--bg);overflow-y:auto;-webkit-overflow-scrolling:touch}
.sheet[hidden]{display:none}
.sheet .wrap{max-width:720px;margin:0 auto;padding:calc(10px + env(safe-area-inset-top)) 16px calc(110px + env(safe-area-inset-bottom))}
.sheet .bar-top{display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;background:var(--bg);padding:6px 0;z-index:2}
.iconbtn{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center}
.iconbtn svg{width:22px;height:22px}
.iconbtn[aria-pressed="true"]{color:var(--beef)}
.hero{padding:6px 0 14px;display:grid;gap:10px;border-bottom:1px solid var(--line)}
.hero h2{font-size:1.75rem;font-weight:800;line-height:1.1}
.macros{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.macro{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 6px;text-align:center}
.macro b{display:block;font-family:var(--display);font-size:1.35rem;font-weight:800;line-height:1.1}
.macro span{font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;font-weight:700}
.macro.k b{color:var(--ink)} .macro.p b{color:var(--p)} .macro.c b{color:var(--c)} .macro.f b{color:var(--f)}
.permeal{font-size:.8rem;color:var(--muted)}
section.block{padding:16px 0;border-bottom:1px solid var(--line);display:grid;gap:10px}
section.block h3{font-size:1.15rem}
.servings{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 8px 8px 14px}
.stepper{display:flex;align-items:center;gap:6px}
.stepper button{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--bg);font-size:1.2rem;font-weight:700}
.stepper output{min-width:34px;text-align:center;font-weight:700;font-size:1.1rem}
ul.ing{list-style:none;margin:0;padding:0;display:grid}
ul.ing li{display:flex;gap:12px;padding:8px 0;border-bottom:1px dashed var(--line)}
ul.ing li:last-child{border-bottom:0}
ul.ing .q{min-width:84px;font-weight:700;font-variant-numeric:tabular-nums}
ol.steps{margin:0;padding-left:1.3em;display:grid;gap:8px}
ol.steps li::marker{font-weight:700;color:var(--accent)}
.tip{background:var(--accent-soft);border-radius:12px;padding:10px 14px;font-size:.92rem}
.sticky-cta{position:fixed;left:0;right:0;bottom:0;z-index:31;padding:10px 16px calc(10px + env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--bg) 30%)}
.sticky-cta .btn{width:100%;max-width:688px;margin:0 auto;display:flex;justify-content:center;padding:14px;font-size:1rem}
.sticky-cta[hidden]{display:none}

/* shopping */
.shop-head{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
.onlist{display:grid;gap:8px}
.onlist .row{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 8px 8px 14px}
.onlist .row .nm{font-weight:500;line-height:1.25}
.onlist .row .nm small{display:block;color:var(--muted);font-weight:400}
.onlist .stepper button{width:32px;height:32px}
.rm{border:0;background:transparent;color:var(--muted);width:32px;height:32px;border-radius:8px}
.aisle{display:grid;gap:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:4px 14px}
.aisle h4{margin:10px 0 4px;font-size:.75rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.item{display:flex;align-items:center;gap:12px;padding:9px 0;border-top:1px solid var(--line)}
.aisle h4 + .item{border-top:0}
.item input{width:22px;height:22px;accent-color:var(--accent);flex:none}
.item label{flex:1;display:flex;justify-content:space-between;gap:10px}
.item .amt{color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.item.done label{text-decoration:line-through;color:var(--muted)}
.addrow{display:flex;gap:8px}
.addrow input{flex:1;min-width:0;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 14px}
.stack{display:grid;gap:14px}
.sync{font-size:.78rem;color:var(--muted)}

.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:.9rem;z-index:50;max-width:calc(100% - 32px);text-align:center}
.toast[hidden]{display:none}
@media (prefers-reduced-motion: no-preference){
  .card{transition:transform .12s ease}
  .card:active{transform:scale(.99)}
}

/* ingredient checks */
label.ingck{display:flex;gap:12px;align-items:flex-start;width:100%;cursor:pointer}
label.ingck input{width:20px;height:20px;accent-color:var(--accent);flex:none;margin-top:1px}
label.ingck.on .q,label.ingck.on .nm{text-decoration:line-through;color:var(--muted)}
.linkbtn{border:0;background:none;color:var(--accent);font-weight:700;padding:4px}
.cta-row{display:flex;gap:8px;max-width:688px;margin:0 auto}
.sticky-cta .cta-row .btn{flex:1;width:auto;max-width:none;margin:0;justify-content:center;padding:14px 10px;font-size:.95rem}
.planadd{display:flex;gap:8px;flex-wrap:wrap}
.planadd select{flex:1;min-width:120px}
/* cooking mode */
.cook{position:fixed;inset:0;z-index:40;background:var(--bg);overflow-y:auto}
.cook .wrap{max-width:720px;margin:0 auto;padding:calc(10px + env(safe-area-inset-top)) 16px calc(24px + env(safe-area-inset-bottom));min-height:100%;display:flex;flex-direction:column;gap:14px}
.cook-top{display:flex;align-items:center;gap:10px}
.cook-title{flex:1;min-width:0;display:grid}
.cook-title b{font-family:var(--display);font-size:1.05rem;line-height:1.2}
.cook-title span{color:var(--muted);font-size:.85rem}
.cook-prog{height:6px;background:var(--line);border-radius:999px;overflow:hidden}
.cook-prog i{display:block;height:100%;background:var(--accent)}
.cook-ing{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:4px 14px}
.cook-step{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:start;flex:1;padding-top:8px}
.cook-num{font-family:var(--display);font-weight:800;font-size:2.2rem;line-height:1;color:var(--accent)}
.cook-step p{margin:0;font-size:1.45rem;line-height:1.4;font-weight:500}
.cook-timers{display:flex;gap:8px;flex-wrap:wrap}
.cook-timers .btn{font-size:1rem;padding:12px 14px}
.cook-nav{display:grid;grid-template-columns:1fr 2fr;gap:10px;position:sticky;bottom:0;background:var(--bg);padding-top:8px}
.cook-nav .btn{justify-content:center;padding:16px;font-size:1.05rem}
.btn[disabled]{opacity:.45;cursor:default}
/* timer tray */
.tray{position:fixed;top:calc(8px + env(safe-area-inset-top));right:8px;left:8px;z-index:60;display:flex;flex-direction:column;align-items:flex-end;gap:6px;pointer-events:none}
.tchip{pointer-events:auto;display:flex;align-items:center;gap:8px;background:var(--ink);color:var(--bg);border-radius:999px;padding:6px 6px 6px 14px;box-shadow:0 4px 16px rgba(0,0,0,.2);max-width:100%}
.tchip .tl{font-size:.8rem;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:46vw}
.tchip b{font-size:1rem}
.tchip button{border:0;background:rgba(255,255,255,.18);color:inherit;width:30px;height:30px;border-radius:50%;font-size:.8rem}
.tchip.done{background:var(--beef);color:#fff}
.tchip.paused{opacity:.75}
@media (prefers-reduced-motion: no-preference){ .tchip.done{animation:pulse 1s ease-in-out infinite} @keyframes pulse{50%{transform:scale(1.04)}} }
/* plan */
.planbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin:4px 0 12px}
.seg{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:3px}
.seg button{border:0;background:transparent;border-radius:9px;padding:7px 14px;font-weight:700;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.weeknav{display:flex;align-items:center;gap:8px;font-weight:700;font-size:.92rem}
.iconbtn.sm{width:36px;height:36px;font-size:1.2rem}
.plan-sum{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:grid;gap:10px}
.plan-sum .lbl{display:block;font-size:.75rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700}
.plan-actions{display:flex;gap:8px;flex-wrap:wrap}
.day{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:grid;gap:6px}
.day.today{border-color:var(--accent);box-shadow:inset 4px 0 0 var(--accent)}
.day-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.day-head h3{font-size:1.1rem}
.day-head h3 span{font-family:var(--body);font-weight:500;color:var(--muted);font-size:.85rem}
.day-tot{font-size:.82rem;color:var(--muted)}
.day-tot b{color:var(--ink)}
.slot{display:grid;grid-template-columns:76px 1fr;gap:8px;padding:6px 0;border-top:1px solid var(--line)}
.slot-l{font-size:.75rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:700;padding-top:7px}
.slot-items{display:grid;gap:6px}
.pe{display:flex;align-items:center;gap:6px}
.pe-n{flex:1;min-width:0;text-align:left;border:0;background:transparent;padding:4px 0;font-weight:500;line-height:1.25}
.pe-n small{display:block;color:var(--muted);font-weight:400;font-size:.78rem}
.stepper.sm button{width:30px;height:30px;font-size:1rem;border-radius:8px}
.stepper.sm output{min-width:22px;font-size:.95rem}
.addslot{justify-self:start;border:1px dashed var(--line);background:transparent;border-radius:10px;padding:6px 12px;color:var(--accent);font-weight:700;font-size:.88rem}
/* picker */
#picker{z-index:35}
.picklist{display:grid;gap:8px}
.pick{display:grid;grid-template-columns:auto 1fr;grid-template-rows:auto auto;column-gap:10px;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 12px;align-items:center}
.pick .pill{grid-row:1/3;align-self:center;color:#fff}
.pick .pk-n{font-weight:500;line-height:1.25}
.pick small{color:var(--muted)}
/* prep timeline */
input[type="time"]{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 10px}
.tl-sum{background:var(--accent-soft);border-radius:12px;padding:12px 14px}
.stack > *{min-width:0}
.has-timers header.top{padding-top:calc(58px + env(safe-area-inset-top))}
.has-timers .cook .wrap,.has-timers .sheet .wrap{padding-top:calc(58px + env(safe-area-inset-top))}
.cook-timers small{font-weight:400;color:var(--muted);font-size:.8rem}
.gantt{max-width:100%;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;display:grid;gap:6px;overflow-x:auto}
.g-row,.g-axis{display:grid;grid-template-columns:86px 1fr;gap:8px;align-items:center;min-width:420px}
.g-row > span{font-size:.75rem;font-weight:700;color:var(--muted)}
.g-track{position:relative;height:26px}
.g-axis .g-track{height:16px}
.g-axis i{position:absolute;top:0;transform:translateX(-50%);font-style:normal;font-size:.66rem;color:var(--muted);white-space:nowrap}
.g-axis i:first-child{transform:none}
.g-grid{position:absolute;top:0;bottom:0;width:1px;background:var(--line)}
.g-track em{position:absolute;top:3px;bottom:3px;border-radius:6px;color:#fff;font-style:normal;font-size:.68rem;font-weight:700;display:flex;align-items:center;padding:0 4px;overflow:hidden;white-space:nowrap}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.8rem;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.tl-h{font-size:1.05rem;margin-top:6px}
ol.tl{list-style:none;margin:0;padding:0;display:grid;gap:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
ol.tl li{display:grid;grid-template-columns:62px 1fr;gap:10px;padding:10px 12px;border-top:1px solid var(--line)}
ol.tl li:first-child{border-top:0}
.tl-time{font-weight:700;font-size:.85rem}
.tl-lane{display:inline-block;font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--c);margin-bottom:2px}
ol.tl b{display:block;font-weight:600;font-size:.92rem}
ol.tl p{margin:2px 0 0;color:var(--muted);font-size:.9rem}
nav.tabs a{font-size:.7rem}

#have{z-index:25}
.havecta{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--accent-soft);border:1px solid var(--accent);color:var(--ink);border-radius:var(--r);padding:12px 14px;margin:2px 0 10px}
.havecta svg{color:var(--accent);flex:none}
.havecta b{display:block;font-family:var(--display);font-size:1.05rem}
.havecta small{display:block;color:var(--muted);font-size:.85rem}
.fglabel{font-size:.75rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700}
.chip.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.sugchip{border-style:dashed}
.havetog{display:grid;gap:8px;font-size:.92rem}
.havetog label{display:flex;gap:10px;align-items:flex-start}
.havetog input{width:20px;height:20px;accent-color:var(--accent);flex:none}
.hcard{padding-right:18px}
.miss{color:var(--beef);font-weight:600}
.sm-btn{padding:7px 12px;font-size:.85rem;z-index:1}

.exrow{display:flex;gap:8px;flex-wrap:wrap}
.copybox{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.45);display:grid;place-items:center;padding:16px}
.cb-card{background:var(--surface);border-radius:var(--r);padding:14px;width:min(560px,100%);display:grid;gap:10px}
.cb-card textarea{width:100%;min-height:50vh;border:1px solid var(--line);border-radius:10px;padding:10px;font:inherit;font-size:.9rem;background:var(--bg);color:var(--ink)}
.cooklist{display:grid;gap:8px}
.ckr{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 14px}
.ckr summary{display:flex;gap:10px;align-items:center;cursor:pointer;list-style:none}
.ckr summary::-webkit-details-marker{display:none}
.ckr summary::after{content:"›";margin-left:auto;font-size:1.3rem;color:var(--muted);transition:transform .15s}
.ckr[open] summary::after{transform:rotate(90deg)}
.ckr summary i{width:10px;height:28px;border-radius:4px;flex:none}
.ckr summary b{display:block;font-weight:600;line-height:1.25}
.ckr summary small{display:block;color:var(--muted)}
.ckr .ing{margin:8px 0}
.tl-rec{display:block;border:0;background:none;padding:0;font-weight:600;font-size:.92rem;color:var(--ink);text-align:left;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}
.legend .lg{border:0;background:none;padding:0;color:var(--muted);font-size:.8rem;display:inline-flex;align-items:center;gap:6px;text-align:left}
ol.tl p.amts{color:var(--ink);background:var(--accent-soft);border-radius:8px;padding:6px 8px;margin-top:6px;font-size:.86rem}
ol.tl p.amts b{color:var(--accent)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>

{"id": 129, "n": "Milo protein yoghurt", "pr": "Vegetarian", "cu": "Snack", "b": "Other", "sn": 1, "t": 2, "fz": 0, "k": 140, "p": 18, "c": 13, "f": 1, "ap": [], "i": [[680, "g", "0% Greek yoghurt", "D"], [4, "tbsp", "Milo", "T"]], "s": ["Portion 170 g yoghurt per container.", "Sprinkle 1 tbsp Milo on top just before eating so it stays crunchy."]},

{"id": 131, "n": "Air fryer crispy tofu nuggets", "pr": "Vegetarian", "cu": "Snack", "b": "Other", "sn": 1, "t": 25, "fz": 0, "k": 185, "p": 17, "c": 9, "f": 9, "ap": ["Air fryer"], "i": [[500, "g", "firm tofu", "D"], [1, "tbsp", "salt-reduced soy sauce", "T"], [1, "cup", "cornflakes", "T"], [null, "", "oil spray", "T"]], "s": ["Press tofu and cut into nuggets; toss in soy.", "Coat in crushed cornflakes; spray.", "Air fry 200°C for 12–15 minutes, shaking halfway."]},

{"id": 136, "n": "Air fryer devilled eggs", "pr": "Vegetarian", "cu": "Snack", "b": "Other", "sn": 1, "t": 25, "fz": 0, "k": 160, "p": 15, "c": 2, "f": 10, "ap": ["Air fryer"], "i": [[8, "", "eggs", "D"], [100, "g", "0% Greek yoghurt", "D"], [1, "tsp", "mustard", "T"], [1, "tsp", "smoked paprika", "T"]], "s": ["Air fry eggs in their shells at 140°C for 15 minutes; cool in iced water and peel.", "Halve; mash the yolks with yoghurt, mustard and salt.", "Spoon back in and dust with paprika. 4 halves per serve."]},

{"id": 217, "n": "Sesame ginger tempeh and broccoli", "pr": "Vegetarian", "cu": "Asian", "b": "Rice", "t": 25, "fz": 1, "k": 455, "p": 32, "c": 49, "f": 18, "ap": [], "i": [[500, "g", "tempeh", "D"], [500, "g", "broccoli", "P"], [3, "tbsp", "salt-reduced soy sauce", "T"], [1, "tbsp", "grated ginger", "P"], [2, "", "garlic cloves", "P"], [1, "tsp", "sesame oil", "T"], [2, "tsp", "honey", "T"], [130, "g", "rice (uncooked)", "T"], [1, "tbsp", "sesame seeds", "T"], [1, "tsp", "oil", "T"]], "s": ["Steam tempeh slices 5 minutes to soften the flavour, then fry in oil until golden.", "Stir-fry broccoli with ginger and garlic, 4 minutes with a splash of water.", "Add soy, honey and sesame oil; toss with tempeh.", "Serve with rice (about 80 g cooked per serve) and sesame seeds."]},
{"id": 218, "n": "Kung pao tofu", "pr": "Vegetarian", "cu": "Asian", "b": "Rice", "t": 25, "fz": 1, "k": 490, "p": 32, "c": 44, "f": 21, "ap": ["Air fryer"], "i": [[800, "g", "firm tofu", "D"], [6, "tsp", "cornflour", "T"], [2, "", "red capsicum", "P"], [30, "g", "roasted peanuts", "T"], [3, "tbsp", "salt-reduced soy sauce", "T"], [1, "tbsp", "hoisin sauce", "T"], [1, "tbsp", "rice vinegar", "T"], [2, "", "red chilli", "P"], [2, "", "garlic cloves", "P"], [140, "g", "rice (uncooked)", "T"], [2, "tsp", "oil", "T"], [null, "", "oil spray", "T"]], "s": ["Toss cubed tofu in 4 tsp cornflour; spray and air fry 200°C for 15 minutes.", "Stir-fry capsicum, chilli and garlic in oil, 3 minutes.", "Add soy, hoisin, vinegar and remaining cornflour with ¼ cup water; simmer until glossy.", "Toss tofu and peanuts through. Serve with rice (about 90 g cooked per serve)."]},
{"id": 219, "n": "Miso udon soup with soft eggs and tofu", "pr": "Vegetarian", "cu": "Asian", "b": "Pasta & noodles", "t": 25, "fz": 0, "k": 480, "p": 33, "c": 53, "f": 16, "ap": ["Thermomix"], "i": [[600, "g", "fresh udon noodles", "T"], [4, "", "eggs", "D"], [500, "g", "firm tofu", "D"], [3, "tbsp", "white miso paste", "D"], [1.2, "L", "vegetable stock", "T"], [200, "g", "mushrooms", "P"], [300, "g", "baby bok choy", "P"], [3, "", "spring onions", "P"]], "s": ["Heat stock with sliced mushrooms 8 min/100°C/speed 1.", "Add cubed tofu and bok choy; 3 min/100°C/reverse/speed soft. Stir in miso off the heat (don't boil it).", "Soft-boil eggs 6½ minutes.", "Store noodles separately. To serve, pour hot broth over udon; top with a halved egg and spring onion."]},
{"id": 220, "n": "Thermomix Thai green curry with tofu", "pr": "Vegetarian", "cu": "Asian", "b": "Rice", "t": 30, "fz": 1, "k": 445, "p": 30, "c": 42, "f": 19, "ap": ["Thermomix"], "i": [[3, "tbsp", "vegetarian green curry paste", "T"], [270, "ml", "light coconut milk", "T"], [0.2, "L", "vegetable stock", "T"], [600, "g", "firm tofu", "D"], [200, "g", "frozen shelled edamame", "F"], [1, "", "zucchini", "P"], [200, "g", "green beans", "P"], [130, "g", "rice (uncooked)", "T"], [1, "bunch", "basil", "P"]], "s": ["Fry curry paste 2 min/120°C/speed 1.", "Add coconut milk and stock; 4 min/100°C/speed 1.", "Add cubed tofu, edamame, zucchini and beans; 8 min/100°C/reverse/speed soft, MC off.", "Stir through basil; serve with rice (about 80 g cooked per serve)."], "tip": "Check the label: some curry and laksa pastes contain shrimp paste or fish sauce. Choose a vegetarian one."},
{"id": 221, "n": "Hoisin plant mince lettuce cups", "pr": "Vegetarian", "cu": "Asian", "b": "Rice", "t": 20, "fz": 1, "k": 490, "p": 33, "c": 54, "f": 16, "ap": [], "i": [[500, "g", "plant-based mince", "F"], [1, "tin", "water chestnuts", "T"], [2, "tbsp", "hoisin sauce", "T"], [1, "tbsp", "salt-reduced soy sauce", "T"], [1, "", "carrot", "P"], [2, "", "garlic cloves", "P"], [1, "tbsp", "grated ginger", "P"], [200, "g", "frozen shelled edamame", "F"], [130, "g", "rice (uncooked)", "T"], [1, "", "iceberg lettuce", "P"]], "s": ["Brown plant mince with garlic and ginger.", "Add chopped water chestnuts, grated carrot, edamame, hoisin and soy; cook 3 minutes.", "Serve with rice (about 80 g cooked per serve).", "Pack lettuce cups separately."], "tip": "Check your plant mince is vegetarian-friendly; most supermarket brands are."},
{"id": 222, "n": "Black pepper tofu with green beans", "pr": "Vegetarian", "cu": "Asian", "b": "Rice", "t": 25, "fz": 1, "k": 460, "p": 31, "c": 48, "f": 17, "ap": ["Air fryer"], "i": [[800, "g", "firm tofu", "D"], [4, "tsp", "cornflour", "T"], [2, "tsp", "cracked black pepper", "T"], [3, "tbsp", "salt-reduced soy sauce", "T"], [1, "tbsp", "kecap manis", "T"], [300, "g", "green beans", "P"], [1, "", "onion", "P"], [3, "", "garlic cloves", "P"], [140, "g", "rice (uncooked)", "T"], [2, "tsp", "oil", "T"], [null, "", "oil spray", "T"]], "s": ["Toss cubed tofu in cornflour; spray and air fry 200°C for 15 minutes.", "Fry onion, garlic and plenty of cracked pepper in oil, 3 minutes.", "Add beans and a splash of water; cover 3 minutes.", "Add soy, kecap manis and tofu; toss. Serve with rice (about 90 g cooked per serve)."]},
{"id": 223, "n": "Thermomix lentil bolognese with lentil pasta", "pr": "Vegetarian", "cu": "Italian", "b": "Pasta & noodles", "t": 35, "fz": 1, "k": 465, "p": 31, "c": 69, "f": 4, "ap": ["Thermomix"], "i": [[280, "g", "red lentil pasta", "T"], [2, "tin", "brown lentils", "T"], [700, "g", "passata", "T"], [1, "", "onion", "P"], [1, "", "carrot", "P"], [1, "", "zucchini", "P"], [2, "", "garlic cloves", "P"], [1, "tsp", "oil", "T"], [1, "tsp", "Italian herbs", "T"], [2, "tbsp", "tomato paste", "T"]], "s": ["Chop onion, carrot, zucchini and garlic 5 sec/speed 5; sauté with oil 5 min/120°C/speed 1.", "Add drained lentils, passata, tomato paste and herbs; cook 20 min/100°C/reverse/speed soft, MC off with basket on top.", "Cook lentil pasta (70 g dry per serve) and toss through.", "Freeze sauce without pasta for best texture."]},
{"id": 224, "n": "Chickpea and feta shakshuka", "pr": "Vegetarian", "cu": "Mediterranean", "b": "Bread & wraps", "t": 30, "fz": 0, "k": 470, "p": 33, "c": 38, "f": 18, "ap": [], "i": [[8, "", "eggs", "D"], [2, "tin", "diced tomatoes", "T"], [1, "tin", "chickpeas", "T"], [1, "", "red capsicum", "P"], [1, "", "onion", "P"], [80, "g", "light feta", "D"], [200, "g", "light cottage cheese", "D"], [4, "slices", "wholegrain bread", "B"], [1, "tsp", "ground cumin", "T"], [1, "tsp", "smoked paprika", "T"], [1, "tsp", "oil", "T"], [1, "bunch", "parsley", "P"]], "s": ["Fry onion and capsicum in oil 5 minutes; add cumin and paprika.", "Add tomatoes and drained chickpeas; simmer 10 minutes until thick.", "Make 8 wells, crack in eggs, cover and cook 6–8 minutes until whites set.", "Top with feta, parsley and 50 g cottage cheese per serve. 2 eggs and a slice of toast each."], "mlx": ["Breakfast", "Lunch", "Dinner"]},
{"id": 225, "n": "Plant mince and black bean burrito bowls", "pr": "Vegetarian", "cu": "Mexican", "b": "Potato", "t": 25, "fz": 1, "k": 485, "p": 34, "c": 58, "f": 11, "ap": [], "i": [[300, "g", "plant-based mince", "F"], [2, "tin", "black beans", "T"], [2, "tbsp", "taco seasoning", "T"], [400, "g", "sweet potato", "P"], [200, "g", "0% Greek yoghurt", "D"], [4, "tbsp", "salsa", "T"], [1, "cup", "corn kernels", "F"], [40, "g", "grated light cheese", "D"], [1, "", "lime", "P"], [1, "", "cos lettuce", "P"]], "s": ["Cube sweet potato and air fry or roast at 200°C for 18 minutes.", "Brown plant mince with taco seasoning; add drained beans, corn and ¼ cup water; simmer 5 minutes.", "Shred the lettuce.", "Bowls: lettuce, mince, sweet potato; top with yoghurt, salsa, cheese and lime."]},
{"id": 226, "n": "Light spinach and ricotta lasagne", "pr": "Vegetarian", "cu": "Italian", "b": "Pasta & noodles", "t": 60, "fz": 1, "k": 480, "p": 37, "c": 48, "f": 15, "ap": [], "i": [[8, "sheets", "dried lasagne sheets", "T"], [400, "g", "light ricotta", "D"], [300, "g", "light cottage cheese", "D"], [250, "g", "baby spinach", "P"], [2, "", "eggs", "D"], [700, "g", "passata", "T"], [80, "g", "light mozzarella", "D"], [1, "tsp", "Italian herbs", "T"]], "s": ["Wilt spinach; squeeze dry and chop. Mix with ricotta, cottage cheese and eggs.", "Layer passata, lasagne sheets and ricotta mix twice; finish with passata and mozzarella.", "Cover and bake at 180°C for 30 minutes; uncover for 10.", "Rest 10 minutes before cutting into 4."]},
{"id": 227, "n": "Air fryer halloumi and chickpea traybake", "pr": "Vegetarian", "cu": "Mediterranean", "b": "Other", "t": 30, "fz": 0, "k": 420, "p": 33, "c": 32, "f": 18, "ap": ["Air fryer"], "i": [[300, "g", "light halloumi", "D"], [2, "tin", "chickpeas", "T"], [2, "", "red capsicum", "P"], [2, "", "zucchini", "P"], [1, "", "red onion", "P"], [250, "g", "cherry tomatoes", "P"], [200, "g", "0% Greek yoghurt", "D"], [1, "", "lemon", "P"], [null, "", "oil spray", "T"], [1, "tsp", "dried oregano", "T"]], "s": ["Toss drained chickpeas, chopped capsicum, zucchini, onion and tomatoes with oregano and oil spray.", "Air fry 200°C for 15 minutes, shaking halfway; split between both air fryers.", "Add sliced halloumi on top; 6–8 minutes more until golden.", "Serve with yoghurt mixed with lemon juice."]},
{"id": 228, "n": "Greek lentil, quinoa and egg bowls", "pr": "Vegetarian", "cu": "Mediterranean", "b": "Other", "t": 25, "fz": 0, "k": 495, "p": 32, "c": 43, "f": 20, "ap": ["Air fryer"], "i": [[2, "tin", "brown lentils", "T"], [8, "", "eggs", "D"], [100, "g", "light feta", "D"], [2, "", "Lebanese cucumber", "P"], [250, "g", "cherry tomatoes", "P"], [1, "", "red onion", "P"], [120, "g", "quinoa", "T"], [1, "", "lemon", "P"], [1, "tbsp", "oil", "T"], [1, "tsp", "dried oregano", "T"]], "s": ["Rinse and cook quinoa in 1½ times its volume of water, 15 minutes.", "Air fry eggs in their shells at 140°C for 15 minutes; cool and peel.", "Toss lentils, quinoa, cucumber, tomatoes and onion with oil, lemon and oregano.", "Top with feta and 2 halved eggs per serve."]},
{"id": 229, "n": "Thermomix mushroom and white bean stroganoff", "pr": "Vegetarian", "cu": "Comfort", "b": "Pasta & noodles", "t": 30, "fz": 1, "k": 415, "p": 36, "c": 56, "f": 4, "ap": ["Thermomix"], "i": [[600, "g", "mushrooms", "P"], [2, "tin", "cannellini beans", "T"], [1, "", "onion", "P"], [2, "", "garlic cloves", "P"], [2, "tsp", "smoked paprika", "T"], [0.3, "L", "vegetable stock", "T"], [300, "g", "0% Greek yoghurt", "D"], [240, "g", "red lentil pasta", "T"], [1, "tsp", "oil", "T"], [1, "bunch", "parsley", "P"]], "s": ["Chop onion and garlic 5 sec/speed 5; sauté with oil 3 min/120°C/speed 1.", "Add sliced mushrooms and paprika; 8 min/120°C/reverse/speed soft, MC off.", "Add drained beans and stock; 5 min/100°C/reverse/speed soft. Cool 2 minutes, then stir in yoghurt on reverse/speed soft.", "Serve over lentil pasta (60 g dry per serve) with parsley."]},
{"id": 230, "n": "Lentil and plant mince cottage pie", "pr": "Vegetarian", "cu": "Comfort", "b": "Potato", "t": 50, "fz": 1, "k": 480, "p": 33, "c": 59, "f": 11, "ap": ["Thermomix"], "i": [[2, "tin", "brown lentils", "T"], [300, "g", "plant-based mince", "F"], [1, "", "onion", "P"], [2, "", "carrot", "P"], [1, "cup", "frozen peas", "F"], [2, "tbsp", "tomato paste", "T"], [0.3, "L", "vegetable stock", "T"], [600, "g", "potatoes", "P"], [0.5, "cup", "skim milk", "D"], [40, "g", "grated light cheese", "D"]], "s": ["Mash: steam potatoes in the Varoma over 500 g water, 25 min/Varoma/speed 1; mash with milk 20 sec/speed 4.", "Brown plant mince with onion and grated carrot; add lentils, tomato paste, stock and peas; simmer 10 minutes.", "Spread into a dish or 4 containers; top with mash and cheese.", "Bake at 200°C for 20 minutes or air fry 180°C for 12 minutes."]},
{"id": 231, "n": "Air fryer tandoori paneer and tofu bowls", "pr": "Vegetarian", "cu": "Indian", "b": "Rice", "t": 35, "fz": 0, "k": 460, "p": 34, "c": 38, "f": 19, "ap": ["Air fryer"], "i": [[150, "g", "paneer", "D"], [400, "g", "firm tofu", "D"], [1, "tin", "chickpeas", "T"], [300, "g", "0% Greek yoghurt", "D"], [2, "tbsp", "tandoori paste", "T"], [100, "g", "rice (uncooked)", "T"], [1, "", "Lebanese cucumber", "P"], [1, "", "red capsicum", "P"], [1, "bunch", "mint", "P"], [null, "", "oil spray", "T"]], "s": ["Mix paste with half the yoghurt; coat cubed paneer, tofu and capsicum. Marinate 20 minutes.", "Air fry 200°C for 12–14 minutes with oil spray, using both air fryers; add drained chickpeas for the last 5 minutes.", "Raita: remaining yoghurt with grated cucumber and mint.", "Serve with rice (about 60 g cooked per serve)."]},

{"id": 233, "n": "Huevos rancheros bowls", "pr": "Vegetarian", "cu": "Mexican", "b": "Bread & wraps", "t": 25, "fz": 0, "k": 435, "p": 30, "c": 41, "f": 15, "ap": [], "i": [[8, "", "eggs", "D"], [1, "tin", "black beans", "T"], [1, "tin", "diced tomatoes", "T"], [1, "", "red capsicum", "P"], [1, "", "onion", "P"], [8, "", "small corn tortillas", "B"], [40, "g", "grated light cheese", "D"], [200, "g", "light cottage cheese", "D"], [1, "tsp", "ground cumin", "T"], [1, "bunch", "coriander", "P"]], "s": ["Fry onion and capsicum 5 minutes; add cumin, tomatoes and drained beans; simmer 8 minutes.", "Fry or poach the eggs.", "Warm tortillas.", "Serve beans with 2 eggs, 2 tortillas, cottage cheese, cheese and coriander per serve."], "mlx": ["Breakfast", "Lunch", "Dinner"]},
{"id": 234, "n": "Air fryer falafel bowls with tahini yoghurt", "pr": "Vegetarian", "cu": "Mediterranean", "b": "Other", "t": 35, "fz": 1, "k": 460, "p": 32, "c": 54, "f": 13, "ap": ["Air fryer", "Thermomix"], "i": [[2, "tin", "chickpeas", "T"], [300, "g", "frozen shelled edamame", "F"], [1, "", "eggs", "D"], [1, "", "onion", "P"], [2, "", "garlic cloves", "P"], [2, "tsp", "ground cumin", "T"], [1, "bunch", "parsley", "P"], [120, "g", "quinoa", "T"], [300, "g", "0% Greek yoghurt", "D"], [1, "tbsp", "tahini", "T"], [1, "", "Lebanese cucumber", "P"], [250, "g", "cherry tomatoes", "P"], [null, "", "oil spray", "T"]], "s": ["Pulse drained chickpeas, edamame, egg, onion, garlic, cumin and parsley 6 sec/speed 5, scraping down; you want texture.", "Shape 20 patties; spray and air fry 190°C for 14–16 minutes, turning halfway (both air fryers).", "Cook quinoa. Mix yoghurt with tahini, lemon and salt.", "Bowls: quinoa, falafel, cucumber, tomato and tahini yoghurt."]},
{"id": 235, "n": "Pesto lentil pasta with peas and ricotta", "pr": "Vegetarian", "cu": "Italian", "b": "Pasta & noodles", "t": 20, "fz": 0, "k": 450, "p": 30, "c": 54, "f": 11, "ap": [], "i": [[320, "g", "red lentil pasta", "T"], [3, "tbsp", "basil pesto", "T"], [200, "g", "light ricotta", "D"], [2, "cup", "frozen peas", "F"], [100, "g", "baby spinach", "P"], [1, "", "lemon", "P"]], "s": ["Cook pasta, adding peas for the last 2 minutes. Reserve ½ cup water.", "Toss with pesto, spinach, lemon zest and a splash of pasta water.", "Top each serve with 50 g ricotta."], "tip": "Some pesto contains parmesan made with animal rennet. Choose a vegetarian pesto if that matters to you."},
{"id": 236, "n": "Air fryer stuffed sweet potatoes", "pr": "Vegetarian", "cu": "Mexican", "b": "Potato", "t": 40, "fz": 1, "k": 490, "p": 33, "c": 66, "f": 10, "ap": ["Air fryer"], "i": [[800, "g", "sweet potato", "P"], [1, "tin", "black beans", "T"], [200, "g", "plant-based mince", "F"], [1, "tbsp", "taco seasoning", "T"], [400, "g", "light cottage cheese", "D"], [4, "tbsp", "salsa", "T"], [40, "g", "grated light cheese", "D"], [1, "cup", "corn kernels", "F"], [2, "", "spring onions", "P"]], "s": ["Prick sweet potatoes; microwave 8 minutes, then air fry 200°C for 15 minutes until tender.", "Brown plant mince with taco seasoning; add beans and corn.", "Split potatoes; fill with the mix and cheese. Air fry 180°C for 4 minutes.", "Top with cottage cheese, salsa and spring onion."]},
{"id": 237, "n": "Air fryer baked feta and tomato lentil pasta", "pr": "Vegetarian", "cu": "Italian", "b": "Pasta & noodles", "t": 30, "fz": 0, "k": 445, "p": 34, "c": 49, "f": 11, "ap": ["Air fryer"], "i": [[500, "g", "cherry tomatoes", "P"], [150, "g", "light feta", "D"], [320, "g", "red lentil pasta", "T"], [3, "", "garlic cloves", "P"], [100, "g", "baby spinach", "P"], [1, "tbsp", "oil", "T"], [200, "g", "0% Greek yoghurt", "D"], [1, "bunch", "basil", "P"]], "s": ["Put tomatoes, garlic and oil in an air fryer-safe dish; sit the feta block in the middle.", "Air fry 200°C for 15 minutes until the tomatoes burst.", "Cook pasta. Mash feta and tomatoes together; stir in yoghurt and spinach.", "Toss with pasta and basil."]},
{"id": 238, "n": "Potato, spinach and feta frittata", "pr": "Vegetarian", "cu": "Mediterranean", "b": "Potato", "t": 40, "fz": 1, "k": 420, "p": 35, "c": 24, "f": 20, "ap": ["Air fryer"], "i": [[12, "", "eggs", "D"], [300, "g", "light cottage cheese", "D"], [80, "g", "light feta", "D"], [150, "g", "baby spinach", "P"], [1, "", "zucchini", "P"], [400, "g", "potatoes", "P"], [1, "", "onion", "P"], [null, "", "oil spray", "T"]], "s": ["Slice potato thinly and microwave 5 minutes to soften.", "Whisk eggs with cottage cheese; fold in spinach, grated zucchini, onion, potato and feta.", "Pour into a lined tin that fits the air fryer; air fry 160°C for 25–30 minutes until set (or bake at 180°C for 35).", "Cut into 4; serve with salad."], "mlx": ["Breakfast", "Lunch", "Dinner"]},

let S = {favs:[], list:[], checked:{}, custom:[], plan:{}, pantry:[], haveOpt:{staples:true, swaps:true}};
const ui = {smp:"any", fl:"all", meal:"all", mince:"all", q:"", cu:new Set(), base:new Set(), x:new Set(), ap:new Set(), sort:"num", servings:{}, open:null};
try{ const raw = localStorage.getItem(LS_KEY); if(raw){ const v = JSON.parse(raw); S = Object.assign(S, v); } }catch(e){}

function sanitize(){
  S.favs = S.favs.filter(id=>byId[id]); S.list = S.list.filter(e=>byId[e.id]);
  if(!S.plan || typeof S.plan !== "object") S.plan = {};
  const cutoff = new Date(); cutoff.setDate(cutoff.getDate()-56);
  for(const k of Object.keys(S.plan)){ const d = S.plan[k]; const [y,m,dd] = k.split("-").map(Number);
    if(new Date(y,m-1,dd) < cutoff){ delete S.plan[k]; continue; }
    for(const s of ["B","L","D","S"]) d[s] = (d[s]||[]).filter(e=>byId[e.id]).map(e=>({id:e.id, serv:Math.max(1, +e.serv||1)})); }
}
sanitize();
let dbRef = null, writing = false, pending = false, saveTimer = null;
function persist(){
  try{ localStorage.setItem(LS_KEY, JSON.stringify(S)); }catch(e){}
  if(!dbRef) return;
  clearTimeout(saveTimer);
  saveTimer = setTimeout(flush, 700);
}
async function flush(){
  if(!dbRef) return;
  if(writing){ pending = true; return; }
  writing = true;
  try{ await dbRef.set(JSON.parse(JSON.stringify(S))); }
  catch(e){ if(e && e.code==="invalid_argument"){ dbRef = null; } }
  writing = false;
  if(pending){ pending = false; flush(); }
}
(async function connect(){
  try{
    if(!window.claude || !claude.use) return;
    const [db, user] = await Promise.all([claude.use("db"), claude.use("user")]);
    if(!db || !user) return;
    const id = await user.id();
    if(!id) return;
    const ref = db.doc("data/users/" + id + "/state");
    const snap = await ref.get();
    dbRef = ref;
    if(snap.exists){
      const d = snap.data() || {};
      S = {favs:Array.isArray(d.favs)?d.favs:[], list:Array.isArray(d.list)?d.list:[], checked:d.checked&&typeof d.checked==="object"?{...d.checked}:{}, custom:Array.isArray(d.custom)?d.custom.map(x=>({...x})):[], plan:d.plan&&typeof d.plan==="object"?JSON.parse(JSON.stringify(d.plan)):{}, pantry:Array.isArray(d.pantry)?d.pantry.map(x=>({t:String(x.t), x:x.x?1:0})):[], haveOpt:d.haveOpt&&typeof d.haveOpt==="object"?{staples:d.haveOpt.staples!==false, swaps:d.haveOpt.swaps!==false}:{staples:true, swaps:true}};
      sanitize();
      try{ localStorage.setItem(LS_KEY, JSON.stringify(S)); }catch(e){}
      render();
    } else if(S.favs.length || S.list.length || S.custom.length || Object.keys(S.plan||{}).length || (S.pantry||[]).length){
      flush();
    }
  }catch(e){}
})();

/* ---------- Formatting ---------- */
const FRACS = [[0,""],[0.25,"¼"],[1/3,"⅓"],[0.5,"½"],[2/3,"⅔"],[0.75,"¾"],[1,""]];
function frac(q){
  let w = Math.floor(q), r = q - w, best = FRACS[0], d = 9;
  for(const f of FRACS){ const dd = Math.abs(r - f[0]); if(dd < d){ d = dd; best = f; } }
  if(best[0] === 1){ w += 1; best = FRACS[0]; }
  if(w === 0 && !best[1]) return "¼";
  return (w ? String(w) : "") + best[1];
}
const PLURAL = {cup:"cups",tin:"tins",head:"heads",bunch:"bunches",bag:"bags",sheets:"sheets",slices:"slices",tsp:"tsp",tbsp:"tbsp"};
function fmtQty(q,u,round){
  if(q == null) return "";
  if(u === "g" || u === "ml"){
    const v = q >= 100 ? Math.round(q/10)*10 : q >= 20 ? Math.round(q/5)*5 : Math.max(1, Math.round(q));
    return v + " " + u;
  }
  if(u === "L") return (Math.round(q*10)/10) + " L";
  if(round && ["","tin","head","bunch","bag","sheets","slices"].includes(u)){
    q = Math.max(1, Math.ceil(q - 0.05));
  }
  const s = frac(q);
  if(!u) return s;
  const unit = q > 1.01 ? (PLURAL[u] || u) : u;
  return s + " " + unit;
}

/* ---------- Helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const heart = (on) => `<svg viewBox="0 0 24 24" fill="${on?"currentColor":"none"}" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8l1 1.1L12 21l7.8-7.5 1-1.1a5.5 5.5 0 0 0 0-7.8Z"/></svg>`;
const snow = `<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 2v20M4.9 4.9l14.2 14.2M2 12h20M4.9 19.1 19.1 4.9"/></svg>`;
let toastT;
function toast(msg){ const t = $("#toast"); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(()=>t.hidden = true, 2200); }
const isFav = id => S.favs.includes(id);
function rcCups(g){ return frac(Math.max(0.25, g/150)); }
function riceTip(r, sv){
  if(r.id === 38 || r.id === 78) return "";
  const rice = r.i.find(x=>x[2]==="rice (uncooked)"); if(!rice) return "";
  const g = rice[0]*sv/4;
  let t = `<div class="tip"><b>Rice cooker:</b> ${rcCups(g)} rice cooker cup${g/150>1.01?"s":""} (about ${fmtQty(g,"g")} uncooked) for ${sv} serve${sv>1?"s":""}. Rinse, fill water to the matching line and use the white rice setting. Your 10-cup cooker can do the whole week's rice in one batch.</div>`;
  if(!r.nr) t += `<div class="tip"><b>Thermomix rice:</b> 1200 g water in the bowl, rice in the simmering basket, cook 17–20 min/100°C/speed 4.</div>`;
  return t;
}
const fmtTime = t => t >= 60 ? `${Math.floor(t/60)} h${t%60?" "+t%60+" min":""}` : `${t} min`;
function toggleFav(id){
  S.favs = isFav(id) ? S.favs.filter(x=>x!==id) : [...S.favs, id];
  persist(); updateDots();
  toast(isFav(id) ? "Saved to favourites" : "Removed from favourites");
}
function macroBar(r){
  const p = r.p*4, c = r.c*4, f = r.f*9, t = p+c+f;
  return `<div class="bar" aria-hidden="true"><i class="bp" style="width:${p/t*100}%"></i><i class="bc" style="width:${c/t*100}%"></i><i class="bf" style="width:${f/t*100}%"></i></div>`;
}
function card(r){
  return `<article class="card" data-m="${r.g}">
    <button class="sr-stretch" data-open="${r.id}" style="all:unset;position:absolute;inset:0;cursor:pointer" aria-label="Open ${esc(r.n)}"></button>
    <div class="meta"><span class="pill">${esc(r.sm ? r.fl[0] : r.pr)}</span><span>#${r.id}</span><span>${r.sm?r.fl.slice(1).filter(f=>f!=="No powder"&&f!=="Dairy-free").join(" · "):r.sn?"Snack":r.ml.join(" · ")}</span>${r.sm&&!r.pw?`<span class="tag">No powder</span>`:""}${r.sm&&r.df?`<span class="tag">Dairy-free</span>`:""}${r.id>=NEW_FROM?'<span style="color:var(--accent);font-weight:700">New</span>':""}</div>

    <div class="meta num"><span><b>${r.k}</b> kcal</span><span><b style="color:var(--p)">${r.p} g</b> protein</span><span>${r.c} g carbs</span><span>${r.f} g fat</span></div>

  </article>`;
}

/* ---------- Filtering ---------- */
function filtered(src, smMode){
  const q = ui.q.trim().toLowerCase();
  let out = src.filter(r=>{
    if(smMode){
      if(ui.fl !== "all" && !r.fl.includes(ui.fl)) return false;
      if(ui.smp === "nopw" && r.pw) return false;
      if(ui.smp === "pw" && !r.pw) return false;
      if(ui.smp === "df" && !r.df) return false;
      if(q){ const hay = (r.n+" "+r.fl.join(" ")+" "+r.i.map(x=>x[2]).join(" ")).toLowerCase(); if(!q.split(/\s+/).every(w=>hay.includes(w))) return false; }
      return true;
    }
    if(ui.mince !== "all" && r.pr !== ui.mince) return false;
    if(ui.ap.size && !((ui.ap.has("none") && !r.ap.length) || r.ap.some(a=>ui.ap.has(a)))) return false;
    if(ui.meal !== "all" && !r.ml.includes(ui.meal)) return false;
    if(ui.cu.size && !ui.cu.has(r.cu)) return false;
    if(ui.base.size && !ui.base.has(r.b)) return false;
    if(ui.x.has("fz") && !r.fz) return false;
    if(ui.x.has("u30") && r.t > 30) return false;
    if(ui.x.has("p45") && r.p < 45) return false;
    if(ui.x.has("k450") && r.k >= 450) return false;
    if(ui.x.has("new") && r.id < NEW_FROM) return false;
    if(q){
      const hay = (r.n+" "+r.cu+" "+r.b+" "+r.pr+" "+r.ap.join(" ")+" "+r.i.map(x=>x[2]).join(" ")).toLowerCase();
      if(!q.split(/\s+/).every(w=>hay.includes(w))) return false;
    }
    return true;
  });
  const s = ui.sort;
  if(s==="protein") out.sort((a,b)=>b.p-a.p||a.id-b.id);
  else if(s==="kcal") out.sort((a,b)=>a.k-b.k||a.id-b.id);
  else if(s==="time") out.sort((a,b)=>a.t-b.t||a.id-b.id);
  else if(s==="ratio") out.sort((a,b)=>b.p/b.k-a.p/a.k);
  else out.sort((a,b)=>a.id-b.id);
  return out;
}
function filterCount(){ return ui.cu.size + ui.base.size + ui.x.size + ui.ap.size + (ui.sort!=="num"?1:0); }

  const h = location.hash.replace("#","");
  if(h === "favourites" || h === "shopping" || h === "smoothies" || h === "plan") return h;
  return "recipes";
}
function render(){
  const tab = currentTab();
  document.querySelectorAll("nav.tabs a").forEach(a=>a.setAttribute("aria-current", a.dataset.tab===tab?"page":"false"));
  $("#recipeTools").hidden = tab === "shopping" || tab === "plan";
  const main = $("#main");
  if(tab === "plan"){
    $("#viewTitle").textContent = ui.planView === "prep" ? "Prep day" : "Meal plan";
    $("#viewSub").textContent = "";
    main.innerHTML = ui.planView === "prep" ? prepView() : planView();
  } else if(tab === "shopping"){
    $("#viewTitle").textContent = "Shopping list";
    $("#viewSub").textContent = "";
    main.innerHTML = shoppingView();
  } else {
    const favs = tab === "favourites", smt = tab === "smoothies";
    $("#viewTitle").textContent = favs ? "Favourites" : smt ? "Smoothies" : "Recipes";
    $("#viewSub").textContent = favs ? "" : smt ? (()=>{ const s = R.filter(r=>r.sm); return `${Math.min(...s.map(r=>r.p))}–${Math.max(...s.map(r=>r.p))} g protein · ${Math.min(...s.map(r=>r.k))}–${Math.max(...s.map(r=>r.k))} kcal`; })() : "Meals 400–500 kcal · snacks 125–340";
    ["#mealChips","#minceChips","#filterBtn"].forEach(s=>$(s).hidden = smt);
    if(smt) $("#filters").hidden = true;
    $("#smChips").hidden = !smt; $("#smpChips").hidden = !smt;
    const src = favs ? R.filter(r=>isFav(r.id)) : smt ? R.filter(r=>r.sm) : R.filter(r=>!r.sm);
    const list = filtered(src, smt);
    const fc = filterCount();
    $("#fcount").hidden = !fc; $("#fcount").textContent = fc;
    if(favs && !src.length){
      main.innerHTML = `<div class="empty"><h3>No favourites yet</h3><p>Tap the heart on any recipe to save it here.</p><a class="btn primary" href="#recipes" style="text-decoration:none">Browse recipes</a></div>`;
    } else if(!list.length){
      main.innerHTML = `<div class="empty"><h3>No recipes match</h3><p>Try fewer filters or a different search.</p><button class="btn" data-reset>Clear filters and search</button></div>`;
    } else {
      main.innerHTML = (favs ? "" : haveCta(smt)) + `<p class="count num">${list.length} of ${src.length} ${smt?"smoothies · macros per smoothie":"recipes · macros per serve"}</p><div class="list">${list.map(card).join("")}</div>`;
    }
  }
  updateDots();
}

/* ---------- Shopping ---------- */
function shopItems(){
  const map = new Map();
  for(const e of S.list){
    const r = byId[e.id]; if(!r) continue;
    const k = e.serv/(r.bs||4);
    for(const [q,u,name,aisle] of r.i){
      const key = name.toLowerCase()+"|"+u;
      const cur = map.get(key) || {key,name,u,aisle,q:0,none:false,from:new Set()};
      if(q == null) cur.none = true; else cur.q += q*k;
      cur.from.add(r.id);
      map.set(key,cur);
    }
  }
  return [...map.values()];
}
function shoppingView(){
  const items = shopItems();
  const total = S.list.reduce((a,e)=>a+e.serv,0);
  let h = `<div class="stack">`;
  if(!S.list.length && !S.custom.length){
    h += `<div class="empty"><h3>Your list is empty</h3><p>Open a recipe, set the servings and tap “Add to shopping list”. Ingredients from every recipe are combined here.</p><a class="btn primary" href="#recipes" style="text-decoration:none">Browse recipes</a></div>`;
  }
  if(S.list.length){
    h += `<div class="shop-head"><h3 style="font-size:1.1rem">Recipes · <span class="num">${total}</span> serves</h3></div>

/* ---------- Durations in step text ---------- */
function durations(text){
  const res = []; let m;
  const re = /(\d+)\s*h(?:ours?)?\s+(\d+)\s*min(?:utes?)?|(\d+)(?:\s*[–-]\s*(\d+))?\s*(hours?\b|h\b|min(?:utes?)?\b|sec(?:onds?)?\b)/gi;
  while((m = re.exec(text))){
    if(m[1]){ const v = +m[1]*60 + +m[2]; res.push({lo:v, hi:v}); }
    else { const u = m[5].toLowerCase(); const mult = u[0]==="h" ? 60 : u[0]==="s" ? 1/60 : 1; res.push({lo:+m[3]*mult, hi:(m[4]?+m[4]:+m[3])*mult}); }
  }
  return res;
}
const minLabel = v => v >= 60 ? `${Math.floor(v/60)} h${v%60?" "+Math.round(v%60)+" min":""}` : `${Math.round(v)} min`;

/* ---------- Timers ---------- */
const TIMERS = []; let tickH = null, actx = null, tidSeq = 1;
function ensureAudio(){ try{ if(!actx){ const AC = window.AudioContext || window.webkitAudioContext; if(AC) actx = new AC(); } if(actx && actx.state === "suspended") actx.resume(); }catch(e){} }
function alarm(t){
  try{ navigator.vibrate && navigator.vibrate([300,150,300,150,300]); }catch(e){}
  try{ if(actx){ for(let i=0;i<4;i++){ const o = actx.createOscillator(), g = actx.createGain(); o.frequency.value = 880; o.connect(g); g.connect(actx.destination); const s = actx.currentTime + i*0.45; g.gain.setValueAtTime(0.0001,s); g.gain.exponentialRampToValueAtTime(0.35,s+0.02); g.gain.exponentialRampToValueAtTime(0.0001,s+0.35); o.start(s); o.stop(s+0.4); } } }catch(e){}
  toast(`Time's up: ${t.label}`);
}
const mmss = ms => { const s = Math.max(0, Math.ceil(ms/1000)); const h = Math.floor(s/3600), m = Math.floor(s%3600/60), x = s%60; return (h ? h+":"+String(m).padStart(2,"0") : m) + ":" + String(x).padStart(2,"0"); };
function startTimer(label, secs){
  ensureAudio();
  TIMERS.push({id:tidSeq++, label, end:Date.now()+secs*1000, left:secs*1000, paused:false, done:false});
  if(!tickH) tickH = setInterval(tick, 500);
  renderTray(); toast(`Timer started: ${minLabel(secs/60)}`);
}
function tick(){
  const now = Date.now(); let changed = false;
  for(const t of TIMERS){ if(t.paused || t.done) continue; t.left = t.end - now; if(t.left <= 0){ t.left = 0; t.done = true; changed = true; alarm(t); } }
  if(changed) renderTray(); else for(const t of TIMERS){ const el = document.querySelector(`[data-tt="${t.id}"]`); if(el && !t.done) el.textContent = mmss(t.left); }
  if(!TIMERS.length){ clearInterval(tickH); tickH = null; }
}
function renderTray(){
  const el = $("#tray");
  document.body.classList.toggle("has-timers", TIMERS.length > 0);
  if(!TIMERS.length){ el.hidden = true; el.innerHTML = ""; return; }
  el.hidden = false;
  el.innerHTML = TIMERS.map(t=>`<div class="tchip ${t.done?"done":""} ${t.paused?"paused":""}"><span class="tl">${esc(t.label)}</span><b class="num" data-tt="${t.id}">${t.done?"Done":mmss(t.left)}</b>${t.done?"":`<button data-tpause="${t.id}" aria-label="${t.paused?"Resume":"Pause"} timer">${t.paused?"▶":"❚❚"}</button>`}<button data-tx="${t.id}" aria-label="Dismiss timer">×</button></div>`).join("");
}

/* ---------- Meal planner ---------- */
const DAYS = ["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
const SLOTS = [["B","Breakfast"],["L","Lunch"],["D","Dinner"],["S","Snacks"]];
const mondayOf = d => { const x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); x.setDate(x.getDate() - (x.getDay()+6)%7); return x; };
const addDays = (d,n) => { const x = new Date(d); x.setDate(x.getDate()+n); return x; };
const keyOf = d => d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const shortDate = d => d.getDate()+" "+d.toLocaleString("en-AU",{month:"short"});

function slotFits(r, s){ if(s==="B") return r.ml.includes("Breakfast") || !!r.sm; if(s==="S") return r.ml.includes("Snack") || !!r.sm; return r.ml.includes(s==="L"?"Lunch":"Dinner"); }
function dayTotals(k){ const d = S.plan[k]; let kc=0, p=0, n=0; if(d) for(const [s] of SLOTS) for(const e of d[s]||[]){ const r = byId[e.id]; if(r){ kc += r.k*e.serv; p += r.p*e.serv; n++; } } return {kc,p,n}; }
function addToPlan(k, s, id, serv){
  if(!S.plan[k]) S.plan[k] = {B:[],L:[],D:[],S:[]};

}
function weekKeys(){ return [...Array(7)].map((_,i)=>keyOf(addDays(ui.week,i))); }
function weekTotals(includeSm){ const m = new Map(); for(const k of weekKeys()){ const d = S.plan[k]; if(!d) continue; for(const [s] of SLOTS) for(const e of d[s]||[]){ const r = byId[e.id]; if(!r || (!includeSm && r.sm)) continue; m.set(r.id, (m.get(r.id)||0) + e.serv); } } return m; }
const xIcon = `<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>`;

  const p = ui.pick, q = p.q.trim().toLowerCase();
  let src = pickBase().filter(r=>{
    if(p.fav && !isFav(r.id)) return false;
    if(p.pr !== "all" && (p.pr === "Smoothies" ? !r.sm : r.pr !== p.pr)) return false;
    if(p.cu.size && !p.cu.has(r.cu)) return false;
    if(p.ap.size && !((p.ap.has("none") && !r.ap.length) || r.ap.some(a=>p.ap.has(a)))) return false;
    if(p.x.has("fz") && !r.fz) return false;

    if(p.x.has("p45") && r.p < 45) return false;

const LANES = [["you","You (prep)"],["tm","Thermomix"],["af1","Air fryer 1"],["af2","Air fryer 2"],["stove1","Stovetop 1"],["stove2","Stovetop 2"],["oven","Oven"],["rc","Rice cooker"]];
const COLORS = ["#2f7d5a","#c0782a","#7a5cc4","#b8517a","#2f6fb0","#8a8a2e","#c44f3b","#3d9aa0","#6b5a3a","#9a4ec0"];
function classify(text){
  const main = text.split(/,?\s+or\s+(?=bake|microwave|pan-fry|steam|cook loose|grill|eat as)/i)[0];
  const ds = durations(main).filter(d=>d.hi >= 1), L = main.toLowerCase();
  const maxHi = ds.length ? Math.max(...ds.map(d=>d.hi)) : 0, sumHi = ds.reduce((a,d)=>a+d.hi, 0);
  if(/overnight/.test(L) && /(refrigerate|marinate|freeze|soak|chill)/.test(L)) return {kind:"night", dur:0};
  if(/air fr/.test(L)) return {kind:"af", dur:Math.round(maxHi)||12, both:/both air fryers|air fryer 2|split between both|both baskets/.test(L)};
  if(/\/speed|varoma|\/\d+°c|mc o(n|ff)|thermomix|speed \d/.test(L)) return {kind:"tm", dur:Math.max(2, Math.round(sumHi)+1)};
  if(/\b(bake|oven|grill|roast)\b/.test(L)) return {kind:"oven", dur:Math.round(maxHi)||20};
  if(/(refrigerate|freeze|chill|marinate|set aside|rest )/.test(L) && ds.length && !/(simmer|brown|fry|boil|cook)/.test(L)) return maxHi > 30 ? {kind:"after", dur:0} : {kind:"wait", dur:Math.round(maxHi)};
  if(/(simmer|brown|fry|stir-fry|sear|boil|poach|\bpan\b|wok|scramble|cook)/.test(L)) return {kind:"stove", dur:Math.round(sumHi)||10};
  return {kind:"prep", dur:Math.min(15, Math.max(3, Math.round(sumHi)||5))};
}
function buildTimeline(sel){
  let riceG = 0; const chains = [];
  for(const [id, serv] of sel){
    const r = byId[id], k = serv/(r.bs||4), chain = [], usedIng = new Set();
    const rice = r.i.find(x=>x[2]==="rice (uncooked)"), useRC = rice && !r.nr && r.id!==38 && r.id!==78;
    if(useRC){ riceG += rice[0]*k; usedIng.add(r.i.indexOf(rice)); }
    for(let s of r.s){
      if(useRC){ const parts = s.split(/(?<=\.)\s+/); if(/^cook (the )?rice/i.test(parts[0])){ parts.shift(); s = parts.join(" "); if(!s) continue; } }
      const c = classify(s); chain.push(Object.assign({rid:id, text:s, amts:stepAmounts(r, s, k, usedIng)}, c));
    }
    chains.push(chain);
  }
  const free = {you:0,tm:0,af1:0,af2:0,stove1:0,stove2:0,oven:0,rc:0}, out = [];
  if(riceG > 0){ out.push({lanes:["rc"], rid:0, start:0, end:45, text:`Rinse ${rcCups(riceG)} rice cooker cups (about ${fmtQty(riceG,"g")}) of rice and start the cooker. This covers every rice recipe below.`}); free.rc = 45; free.you = 2; }
  const pos = chains.map(()=>0), ready = chains.map(()=>0);
  const remain = ci => chains[ci].slice(pos[ci]).reduce((a,x)=>a+x.dur, 0);
  let t = 0, guard = 0;
  while(chains.some((c,ci)=>pos[ci] < c.length) && guard++ < 5000){
    let started = false;
    const order = chains.map((c,ci)=>ci).filter(ci=>pos[ci] < chains[ci].length && ready[ci] <= t).sort((a,b)=>{ const ta = chains[a][pos[a]], tb = chains[b][pos[b]];
      if(ta.kind === tb.kind && (ta.kind === "tm" || ta.kind === "oven")) return ta.dur - tb.dur;
      return remain(b) - remain(a); });
    for(const ci of order){
      const task = chains[ci][pos[ci]];
      if(task.kind === "night" || task.kind === "after"){ out.push({lanes:[], kind:task.kind, rid:task.rid, start:t, end:t, text:task.text, amts:task.amts}); pos[ci]++; started = true; continue; }
      if(task.kind === "wait"){ out.push({lanes:[], kind:"wait", rid:task.rid, start:t, end:t+task.dur, text:task.text, amts:task.amts}); pos[ci]++; ready[ci] = t+task.dur; started = true; continue; }
      let lanes = null;
      if(task.kind === "prep") lanes = free.you <= t ? ["you"] : null;
      else if(task.kind === "tm") lanes = free.tm <= t ? ["tm"] : null;
      else if(task.kind === "oven") lanes = free.oven <= t ? ["oven"] : null;
      else if(task.kind === "stove"){ const l = ["stove1","stove2"].find(l=>free[l] <= t); lanes = l ? [l] : null; }
      else if(task.kind === "af"){ const fa = ["af1","af2"].filter(l=>free[l] <= t); lanes = task.both ? (fa.length===2 ? fa : null) : (fa.length ? [fa[0]] : null); }
      if(!lanes) continue;
      const end = t + task.dur;
      lanes.forEach(l=>free[l] = end + (l==="tm" ? 2 : 0));
      out.push({lanes, kind:task.kind, rid:task.rid, start:t, end, text:task.text, amts:task.amts});
      pos[ci]++; ready[ci] = end; started = true;
    }
    if(!started){ const c = [...Object.values(free), ...ready].filter(x=>x > t); t = c.length ? Math.min(...c) : t+1; }
  }
  const last = Math.max(0, ...out.map(o=>o.end), free.rc), st = Math.max(last, free.you);
  out.push({lanes:["you"], kind:"prep", rid:0, start:st, end:st+15, text:"Cool, portion into containers and label. Into the fridge or freezer within 2 hours of cooking."});
  return {out, total:st+15, ids:sel.map(x=>x[0]), serv:Object.fromEntries(sel)};
}

/* ---------- What can I make? ---------- */
const STAPLE_RE = /^(oil|oil spray|olive oil|sesame oil|cinnamon|vanilla essence|baking powder|garlic powder|smoked paprika|paprika|dried [a-z]+|italian herbs|ground [a-z]+|curry powder|garam masala|ras el hanout|chilli flakes|chilli powder|cracked black pepper|sichuan pepper|taco seasoning|fajita seasoning|shawarma spice|cornflour|plain flour|brown sugar|salt-reduced soy sauce|sweet chilli sauce|tomato sauce|worcestershire sauce|oyster sauce|vegetarian oyster sauce|hoisin sauce|fish sauce|rice vinegar|red wine vinegar|balsamic vinegar|mustard|vegetable stock|salt-reduced chicken stock|salt-reduced beef stock|beef stock cube|tomato paste|fennel seeds|ground nutmeg|ground turmeric|kecap manis|sambal oelek|chilli bean paste)$/i;
const SWAPS = [["skim milk","unsweetened almond milk"],["vanilla protein powder","chocolate protein powder","plant protein powder"],["0% Greek yoghurt","light Greek yoghurt"],["frozen mixed berries","frozen strawberries","frozen blueberries","frozen raspberries","strawberries"],["peanut butter","almond butter"],["honey","maple syrup"],["grated light cheese","light mozzarella","light cheese slices"],["light cottage cheese","light ricotta"],["frozen mango","frozen pineapple"],["chicken breast fillets","chicken thigh fillets (trimmed)"],["chicken breast mince","lean turkey mince"],["wholemeal wraps","small wholemeal tortillas","small corn tortillas"],["rice noodles","rice vermicelli"],["feta","light feta"],["rice (uncooked)","jasmine rice"],["spaghetti","short pasta","pappardelle"],["red lentil pasta","short pasta","spaghetti"]];
const isStaple = x => x[0] == null || STAPLE_RE.test(x[2]);
const ING_FREQ = new Map(); for(const r of R) for(const x of r.i) ING_FREQ.set(x[2], (ING_FREQ.get(x[2])||0)+1);
const ALL_ING = [...ING_FREQ.keys()].sort((a,b)=>ING_FREQ.get(b)-ING_FREQ.get(a));
const SMOOTHIE_QUICK = ["banana","frozen mixed berries","vanilla protein powder","chocolate protein powder","skim milk","unsweetened almond milk","0% Greek yoghurt","light cottage cheese","peanut butter","rolled oats","cocoa powder","baby spinach","frozen mango","medjool dates","chia seeds","honey","instant coffee","frozen strawberries"];
const HAVE_SCOPES = [["sm","Smoothies"],["meals","Meals"],["br","Breakfast"],["sn","Snacks"],["all","Everything"]];
const normW = s => s.toLowerCase().replace(/\(.*?\)/g," ").replace(/[^a-z0-9% ]+/g," ").split(/\s+/).filter(Boolean);
ui.have = null;
function haveOpts(){ if(!S.haveOpt) S.haveOpt = {staples:true, swaps:true}; return S.haveOpt; }
function pantry(){ if(!Array.isArray(S.pantry)) S.pantry = []; return S.pantry; }
function userHas(name){
  const ws = normW(name);
  for(const p of pantry()){
    if(p.x){ if(p.t === name) return true; }
    else { const pw = normW(p.t); if(pw.length && pw.every(w=>ws.includes(w) || ws.includes(w.replace(/s$/,"")) || ws.includes(w+"s"))) return true; }
  }
  return false;
}
function satisfy(name){
  if(userHas(name)) return {ok:true};
  if(haveOpts().swaps){ for(const g of SWAPS) if(g.includes(name)){ const alt = g.find(n=>n!==name && userHas(n)); if(alt) return {ok:true, swap:alt}; } }
  return {ok:false};
}
function inScope(r, sc){
  if(sc === "sm") return !!r.sm;
  if(sc === "sn") return !!r.sn;
  if(sc === "br") return r.ml.includes("Breakfast");
  if(sc === "meals") return !r.sm && !r.sn && (r.ml.includes("Lunch") || r.ml.includes("Dinner"));
  return true;
}
function haveResults(){
  const sc = ui.have.scope, out = [];
  if(!pantry().length) return out;
  for(const r of R){
    if(!inScope(r, sc)) continue;
    const need = r.i.filter(x=>!(haveOpts().staples && isStaple(x)));
    if(!need.length) continue;
    let have = 0; const miss = [], swaps = [];
    for(const x of need){ const s = satisfy(x[2]); if(s.ok){ have++; if(s.swap) swaps.push([s.swap, x[2]]); } else miss.push(x[2]); }
    if(!have || miss.length > 3 || have < Math.ceil(need.length*0.4)) continue;
    out.push({r, have, need:need.length, miss, swaps});
  }
  return out.sort((a,b)=>a.miss.length-b.miss.length || b.have/b.need-a.have/a.need || b.r.p-a.r.p);
}
function openHave(){

function recipeText(r, sv, macrosOnly){
  const k = sv/(r.bs||4);

  if(macrosOnly) return `${r.n}\n${macro}\nServes ${sv} | Total: ${r.k*sv} kcal | Protein ${r.p*sv} g | Carbs ${r.c*sv} g | Fat ${r.f*sv} g`;
  const lines = [r.n, `Serves ${sv} | ${fmtTime(r.t)}`, macro, "", `Ingredients (${sv} serve${sv>1?"s":""})`,
    ...r.i.map(x=>"- " + (x[0]==null ? "" : fmtQty(x[0]*k, x[1]) + " ") + x[2]), "", "Method", ...r.s.map((s,i)=>`${i+1}. ${s}`)];

let jsPdfP = null;
function loadJsPDF(){
  if(window.jspdf) return Promise.resolve(window.jspdf);
