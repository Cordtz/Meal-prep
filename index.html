const pdfSafe = s => String(s).replace(/⅓/g,"1/3").replace(/⅔/g,"2/3").replace(/−/g,"-").replace(/[^\x00-\xFF–—‘’“”•…]/g,"");
async function makePdf(r, sv){
  const {jsPDF} = await loadJsPDF();
  const doc = new jsPDF({unit:"mm", format:"a4"}), W = 210, M = 18, CW = W - 2*M, k = sv/(r.bs||4);
  let y = 22;
  const ink = [23,33,27], mute = [91,105,96], green = [31,122,77];
  const ensure = h => { if(y + h > 280){ doc.addPage(); y = 20; } };
  const para = (txt, size, style, color, gap, x = M, w = CW) => {
    doc.setFont("helvetica", style); doc.setFontSize(size); doc.setTextColor(...color);
    for(const l of doc.splitTextToSize(pdfSafe(txt), w)){ ensure(size*0.42); doc.text(l, x, y); y += size*0.42; }
    y += gap;
  };
  const heading = t => { ensure(14); y += 2; doc.setFont("helvetica","bold"); doc.setFontSize(13); doc.setTextColor(...green); doc.text(pdfSafe(t), M, y); y += 2; doc.setDrawColor(221,227,217); doc.line(M, y, W-M, y); y += 6; };
  doc.setFillColor(...green); doc.rect(0, 0, W, 7, "F");
  para(r.n, 20, "bold", ink, 2);
  para(`${r.sm ? "Smoothie" : r.pr} · ${r.cu} · ${fmtTime(r.t)} · Serves ${sv}${r.ap.length ? " · " + r.ap.join(", ") : ""}`, 10, "normal", mute, 4);
  ensure(24);
  const bw = (CW - 9)/4;
  [["kcal", r.k, ""], ["Protein", r.p, " g"], ["Carbs", r.c, " g"], ["Fat", r.f, " g"]].forEach(([l,v,u],i)=>{
    const x = M + i*(bw+3); doc.setFillColor(226,240,231); doc.roundedRect(x, y, bw, 18, 2, 2, "F");
    doc.setFont("helvetica","bold"); doc.setFontSize(15); doc.setTextColor(...ink); doc.text(`${v}${u}`, x + bw/2, y + 9, {align:"center"});
    doc.setFont("helvetica","normal"); doc.setFontSize(7.5); doc.setTextColor(...mute); doc.text(`${l.toUpperCase()} PER SERVE`, x + bw/2, y + 14.5, {align:"center"});
  });
  y += 22;
  para(`Batch total for ${sv} serve${sv>1?"s":""}: ${r.k*sv} kcal · ${r.p*sv} g protein · ${r.c*sv} g carbs · ${r.f*sv} g fat`, 9, "normal", mute, 2);
  heading(`Ingredients (${sv} serve${sv>1?"s":""})`);
  for(const x of r.i){
    const q = x[0]==null ? "" : fmtQty(x[0]*k, x[1]);
    doc.setFontSize(10.5); const lines = doc.splitTextToSize(pdfSafe(x[2] + (x[0]==null ? " (to cook)" : "")), CW - 34);
    ensure(lines.length*4.6 + 1.5);
    doc.setFont("helvetica","bold"); doc.setTextColor(...ink); doc.text(pdfSafe(q), M, y);
    doc.setFont("helvetica","normal"); lines.forEach((l,i)=>doc.text(l, M + 34, y + i*4.6));
    y += lines.length*4.6 + 1.5;
  }
  heading("Method");
  r.s.forEach((s,i)=>{
    doc.setFontSize(10.5); const lines = doc.splitTextToSize(pdfSafe(s), CW - 9);
    ensure(lines.length*4.6 + 2.5);
    doc.setFont("helvetica","bold"); doc.setTextColor(...green); doc.text(String(i+1), M, y);
    doc.setFont("helvetica","normal"); doc.setTextColor(...ink); lines.forEach((l,j)=>doc.text(l, M + 9, y + j*4.6));
    y += lines.length*4.6 + 2.5;
  });
  const notes = [r.tip, r.alt].filter(Boolean);
  if(notes.length){ heading("Tips"); notes.forEach(n=>para(n, 10, "normal", ink, 2)); }
  heading("Storing");
  para(r.sm ? "Best blended fresh. Blend the night before and keep sealed in the fridge for up to 24 hours. Freezer packs keep 3 months."
    : `Fridge up to 4 days in airtight containers.${r.fz ? " Freezes up to 3 months." : ""}${r.sn ? "" : " Reheat until piping hot."}`, 10, "normal", ink, 2);
  const pages = doc.getNumberOfPages();
  for(let i=1;i<=pages;i++){ doc.setPage(i); doc.setFont("helvetica","normal"); doc.setFontSize(8); doc.setTextColor(...mute);
    doc.text("High-Protein Meal Prep · macros are estimates", M, 290); doc.text(`${i} / ${pages}`, W - M, 290, {align:"right"}); }
  return doc.output("blob");
}
async function savePdf(r, sv){
  toast("Making your PDF…");
  let blob;
  try{ blob = await makePdf(r, sv); }catch(e){ toast("Couldn't create the PDF. Check your connection and try again."); return; }
  const filename = r.n.replace(/[^\w\s-]/g,"").trim().replace(/\s+/g,"-").toLowerCase() + ".pdf";
  let dl = null;
  try{ if(window.claude && claude.use) dl = await claude.use("downloads"); }catch(e){}
  if(dl){
    try{ await dl.save({filename, data:blob}); toast("PDF saved"); }
    catch(e){ if(e && (e.code === "declined" || e.code === "rate_limited")) return; toast("Downloads aren't available in this view"); }
    return;
  }
  const url = URL.createObjectURL(blob), a = document.createElement("a");
  a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 10000);
}
document.addEventListener("click", e=>{
  const T = e.target;
  if(T.closest("#copyRecipe")){ const r = byId[ui.open]; copyText(recipeText(r, ui.servings[r.id]), "Recipe"); return; }
  if(T.closest("#copyMacros")){ const r = byId[ui.open]; copyText(recipeText(r, ui.servings[r.id], true), "Macros"); return; }
  if(T.closest("#pdfBtn")){ const r = byId[ui.open]; savePdf(r, ui.servings[r.id]); return; }
  if(T.closest("#cbClose") || T.id === "copybox"){ $("#copybox").hidden = true; return; }
  const os = T.closest("[data-openserv]"); if(os){ e.stopPropagation(); const [id, sv] = os.dataset.openserv.split("|").map(Number); ui.servings[id] = sv; openRecipe(id); return; }
}, true);


/* ---------- Share ---------- */
const inClaude = () => !!(window.claude && claude.use);
function recipeLink(id){ return inClaude() ? "" : location.origin + location.pathname + "#r-" + id; }
async function shareRecipe(r, sv){
  const link = recipeLink(r.id);
  const text = recipeText(r, sv) + (link ? "\n\nOpen in the app: " + link : "");
  if(navigator.share && !inClaude()){
    try{ await navigator.share({title: r.n, text}); return; }
    catch(e){ if(e && e.name === "AbortError") return; }
  }
  const p = navigator.clipboard && navigator.clipboard.writeText ? navigator.clipboard.writeText(text) : Promise.reject();
  p.then(()=>toast("Recipe copied. Paste it into a message, email or app.")).catch(()=>showCopyBox(text));
}
function routeRecipe(){ const m = location.hash.match(/^#r-(\d+)$/); if(m && byId[+m[1]] && ui.open !== +m[1]) openRecipe(+m[1]); }
document.addEventListener("click", e=>{
  if(e.target.closest("#shareBtn") || e.target.closest("#shareBtn2")){ const r = byId[ui.open]; if(r) shareRecipe(r, ui.servings[r.id]); }
}, true);
window.addEventListener("hashchange", routeRecipe);

/* ---------- Prep day: amounts per step, PDF, share ---------- */
const ING_STOP = new Set("light lean salt reduced frozen fresh small large baby dried ground grated shaved trimmed uncooked fillets fillet mix sticks cloves sauce powder paste seeds leg diced sliced whole plain extra firm medjool lebanese wholemeal wholegrain unsweetened vegetarian sheets shelled dry roasted sweet brown the and".split(" "));
function ingWords(name){ return name.toLowerCase().replace(/\(.*?\)/g," ").replace(/[^a-z ]+/g," ").split(/\s+/).filter(w=>w.length>=3 && !ING_STOP.has(w)); }
function mentions(text, w){
  const c = [...new Set([w, w.replace(/es$/,""), w.replace(/s$/,"")])].filter(Boolean).map(x=>x.replace(/[^a-z]/g,""));
  return new RegExp("\\b(?:" + c.join("|") + ")(?:s|es)?\\b", "i").test(text);
}
function stepAmounts(r, text, k, used){
  const out = [];
  r.i.forEach((x,ix)=>{ if(used.has(ix)) return; const ws = ingWords(x[2]); if(!ws.length) return;
    if(ws.some(w=>mentions(text, w))){ used.add(ix); out.push((x[0]==null ? "" : fmtQty(x[0]*k, x[1]) + " ") + x[2]); } });
  return out;
}
const hexRgb = h => [1,3,5].map(i=>parseInt(h.slice(i,i+2),16));
function prepSorted(tl){ return { night: tl.out.filter(o=>o.kind==="night"), steps: tl.out.filter(o=>o.kind!=="night").sort((a,b)=>a.start-b.start || (a.rid-b.rid)) }; }
const laneNameOf = o => o.kind==="wait" ? "Wait" : o.kind==="after" ? "Then" : o.lanes.map(l=>LANES.find(x=>x[0]===l)[1]).join(" + ");
function prepText(tl){
  const {night, steps} = prepSorted(tl);
  const L = [`PREP DAY PLAN`, `Start ${clockAt(0)} · about ${minLabel(tl.total)} · finish around ${clockAt(tl.total)}`, "", "WHAT TO COOK"];
  for(const id of tl.ids){ const r = byId[id], sv = tl.serv[id], k = sv/(r.bs||4);
    L.push("", `#${id} ${r.n} (${sv} serve${sv>1?"s":""}, ${r.k} kcal / ${r.p} g protein per serve)`, ...r.i.map(x=>"- " + (x[0]==null ? "" : fmtQty(x[0]*k,x[1]) + " ") + x[2])); }
  const line = o => [`${o.kind==="night" ? "Night before" : clockAt(o.start)} · ${laneNameOf(o)}${o.end>o.start ? " · " + minLabel(o.end-o.start) : ""}${o.rid ? " · #" + o.rid + " " + byId[o.rid].n : ""}`, `   ${o.text}`, ...(o.amts && o.amts.length ? [`   Use: ${o.amts.join(", ")}`] : [])];
  if(night.length){ L.push("", "THE NIGHT BEFORE"); night.forEach(o=>L.push(...line(o))); }
  L.push("", "STEP BY STEP"); steps.forEach(o=>L.push(...line(o), ""));
  return L.join("\n");
}
async function makePrepPdf(tl){
  const {jsPDF} = await loadJsPDF();
  const doc = new jsPDF({unit:"mm", format:"a4"}), W = 210, M = 15, CW = W - 2*M;
  const ink = [23,33,27], mute = [91,105,96], green = [31,122,77];
  let y = 20;
  const ensure = h => { if(y + h > 282){ doc.addPage(); y = 18; } };
  const txt = (t, x, size, style, color, w) => { doc.setFont("helvetica", style); doc.setFontSize(size); doc.setTextColor(...color); const ls = doc.splitTextToSize(pdfSafe(t), w); ls.forEach((l,i)=>doc.text(l, x, y + i*size*0.42)); return ls.length*size*0.42; };
  const heading = t => { ensure(14); y += 3; doc.setFont("helvetica","bold"); doc.setFontSize(13); doc.setTextColor(...green); doc.text(t, M, y); y += 2; doc.setDrawColor(221,227,217); doc.line(M, y, W-M, y); y += 6; };
  const colorOf = rid => rid ? hexRgb(COLORS[tl.ids.indexOf(rid) % COLORS.length]) : mute;
  doc.setFillColor(...green); doc.rect(0, 0, W, 7, "F");
  y += txt("Prep day plan", M, 20, "bold", ink, CW) + 2;
  y += txt(`Start ${clockAt(0)} · about ${minLabel(tl.total)} · finish around ${clockAt(tl.total)} · ${tl.ids.length} recipes`, M, 10, "normal", mute, CW) + 3;
  heading("What to cook");
  for(const id of tl.ids){
    const r = byId[id], sv = tl.serv[id], k = sv/(r.bs||4);
    const items = r.i.map(x=>[x[0]==null ? "" : fmtQty(x[0]*k, x[1]), x[2]]);
    const rows = Math.ceil(items.length/2);
    ensure(10 + rows*4.4);
    doc.setFillColor(...colorOf(id)); doc.rect(M, y-3.5, 2.2, 5, "F");
    y += txt(`#${id} ${r.n}`, M+4, 11, "bold", ink, CW-60);
    doc.setFont("helvetica","normal"); doc.setFontSize(9); doc.setTextColor(...mute); doc.text(pdfSafe(`${sv} serve${sv>1?"s":""} · ${r.k} kcal · ${r.p} g protein per serve`), W-M, y - 4.6, {align:"right"});
    y += 1;
    const colW = CW/2;
    items.forEach((it, i)=>{ const col = i < rows ? 0 : 1, row = i < rows ? i : i - rows, x = M + 4 + col*colW, yy = y + row*4.4;
      doc.setFont("helvetica","bold"); doc.setFontSize(9); doc.setTextColor(...ink); doc.text(pdfSafe(it[0]), x, yy);
      doc.setFont("helvetica","normal"); doc.text(pdfSafe(doc.splitTextToSize(pdfSafe(it[1]), colW-26)[0]), x+22, yy); });
    y += rows*4.4 + 3;
  }
  heading("Timeline");
  const used = LANES.filter(([l])=>tl.out.some(o=>o.lanes.includes(l))), T = Math.max(tl.total, 30), lx = M + 26, lw = CW - 26;
  ensure(8 + used.length*7);
  doc.setFontSize(7); doc.setTextColor(...mute); doc.setFont("helvetica","normal");
  for(let m=0; m<=T; m+=30) doc.text(clockAt(m), lx + m/T*lw, y, {align: m===0 ? "left" : "center"});
  y += 3;
  for(const [l, lab] of used){
    doc.setFontSize(8); doc.setTextColor(...mute); doc.text(lab, M, y+4);
    doc.setFillColor(243,245,240); doc.rect(lx, y, lw, 6, "F");
    for(const o of tl.out.filter(o=>o.lanes.includes(l))){ const x = lx + o.start/T*lw, w = Math.max(1, (o.end-o.start)/T*lw);
      doc.setFillColor(...colorOf(o.rid)); doc.roundedRect(x, y+0.6, w, 4.8, 1, 1, "F");
      if(o.rid && w > 7){ doc.setFontSize(6.5); doc.setTextColor(255,255,255); doc.setFont("helvetica","bold"); doc.text("#"+o.rid, x+1.2, y+4); doc.setFont("helvetica","normal"); } }
    y += 7;
  }
  const {night, steps} = prepSorted(tl);
  const stepRow = o => {
    doc.setFontSize(10); const tl1 = doc.splitTextToSize(pdfSafe(o.text), CW-26);
    doc.setFontSize(9); const am = o.amts && o.amts.length ? doc.splitTextToSize(pdfSafe("Use: " + o.amts.join(", ")), CW-26) : [];
    const h = 5 + (o.rid ? 4.4 : 0) + tl1.length*4.3 + am.length*4 + 3;
    ensure(h);
    doc.setFont("helvetica","bold"); doc.setFontSize(10); doc.setTextColor(...ink); doc.text(o.kind==="night" ? "Night before" : clockAt(o.start), M, y);
    const x = M + 26; let yy = y;
    doc.setFontSize(7.5); doc.setTextColor(...colorOf(o.rid)); doc.text(pdfSafe((laneNameOf(o) + (o.end>o.start ? " · " + minLabel(o.end-o.start) : "")).toUpperCase()), x, yy); yy += 4.4;
    if(o.rid){ doc.setFontSize(10); doc.setTextColor(...ink); doc.text(pdfSafe(`#${o.rid} ${byId[o.rid].n}`), x, yy); yy += 4.4; }
    doc.setFont("helvetica","normal"); doc.setFontSize(10); doc.setTextColor(...ink); tl1.forEach(l=>{ doc.text(l, x, yy); yy += 4.3; });
    if(am.length){ doc.setFontSize(9); doc.setTextColor(...green); am.forEach(l=>{ doc.text(l, x, yy); yy += 4; }); }
    y = yy + 3; doc.setDrawColor(230,234,227); doc.line(M, y-2, W-M, y-2); y += 2;
  };
  if(night.length){ heading("The night before"); night.forEach(stepRow); }
  heading("Step by step"); steps.forEach(stepRow);
  const pages = doc.getNumberOfPages();
  for(let i=1;i<=pages;i++){ doc.setPage(i); doc.setFont("helvetica","normal"); doc.setFontSize(8); doc.setTextColor(...mute); doc.text("High-Protein Meal Prep · prep-day timeline (times are estimates)", M, 290); doc.text(`${i} / ${pages}`, W-M, 290, {align:"right"}); }
  return doc.output("blob");
}
async function saveBlob(blob, filename){
  let dl = null;
  try{ if(window.claude && claude.use) dl = await claude.use("downloads"); }catch(e){}
  if(dl){ try{ await dl.save({filename, data:blob}); toast("PDF saved"); }catch(e){ if(e && (e.code==="declined" || e.code==="rate_limited")) return; toast("Downloads aren't available in this view"); } return; }
  const url = URL.createObjectURL(blob), a = document.createElement("a"); a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url), 10000);
}
async function sharePrep(tl){
  const text = prepText(tl);
  if(navigator.share && !inClaude()){ try{ await navigator.share({title:"Prep day plan", text}); return; }catch(e){ if(e && e.name === "AbortError") return; } }
  const p = navigator.clipboard && navigator.clipboard.writeText ? navigator.clipboard.writeText(text) : Promise.reject();
  p.then(()=>toast("Prep plan copied. Paste it into a message, email or notes.")).catch(()=>showCopyBox(text));
}
document.addEventListener("click", async e=>{
  if(e.target.closest("#prepPdf") && ui.timeline){ toast("Making your PDF…"); let blob; try{ blob = await makePrepPdf(ui.timeline); }catch(err){ toast("Couldn't create the PDF. Check your connection and try again."); return; } saveBlob(blob, `prep-day-${keyOf(new Date())}.pdf`); }
  if(e.target.closest("#prepShare") && ui.timeline) sharePrep(ui.timeline);
});

render();
routeRecipe();
</script>
